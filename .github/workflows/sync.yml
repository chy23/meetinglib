name: 同步會議資料
on:
  schedule:
    - cron: "15 * * * *"   # 每小時
  workflow_dispatch:        # 可在 Actions 頁手動執行
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/sync.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "同步會議資料" && git push)
