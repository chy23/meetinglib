name: 同步會議資料
on:
  schedule:
    - cron: "15 * * * *"   # 每小時執行
  workflow_dispatch:        # 可在 Actions 頁隨時手動執行
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安裝依賴（PDF 壓縮）
        run: pip install --quiet pypdf || true
      - name: 執行同步與結構化分析
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/sync.py
      - name: 提交並推送更新
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "自動同步：更新會議資料與智慧摘要" && git push)
