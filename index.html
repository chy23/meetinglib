<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>📚 會議資料庫 - 教師午會圖書館</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root {
    --bg: #f8f6f0;
    --panel: #ffffff;
    --panel-sub: #fdfbf7;
    --ink: #202428;
    --ink-light: #525960;
    --muted: #7b838b;
    --accent: #2e5c8a;
    --accent-light: #e8f0f8;
    --accent-dark: #1d3d5e;
    --warm: #8b5e34;
    --warm-bg: #fdf5ea;
    --line: #e6e2d8;
    --line-light: #f0ece3;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --pdf-zoom: 1.0;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.6;
    overflow-x: hidden;
  }

  /* 頂部導航列 Header */
  header {
    height: 60px;
    padding: 0 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    display: flex;
    gap: 16px;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: var(--ink);
    flex-shrink: 0;
  }
  .brand-icon {
    font-size: 22px;
    background: var(--accent-light);
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-sm);
  }
  .brand h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .brand small {
    display: block;
    font-size: 11px;
    color: var(--muted);
    font-weight: 400;
  }

  /* 搜尋列 */
  .search-wrap {
    flex: 1;
    max-width: 500px;
    position: relative;
    display: flex;
    align-items: center;
  }
  .search-icon {
    position: absolute;
    left: 12px;
    color: var(--muted);
    font-size: 14px;
    pointer-events: none;
  }
  #q {
    width: 100%;
    height: 38px;
    padding: 0 34px 0 34px;
    border: 1px solid var(--line);
    background: var(--panel-sub);
    border-radius: 20px;
    font-size: 14px;
    color: var(--ink);
    outline: none;
    transition: all 0.2s;
  }
  #q:focus {
    background: #fff;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(46,92,138,0.15);
  }
  .search-clear {
    position: absolute;
    right: 10px;
    width: 20px;
    height: 20px;
    border: none;
    background: #ddd;
    color: #555;
    border-radius: 50%;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 11px;
  }
  .search-clear.show { display: flex; }

  /* 頂部縮放與動作工具 */
  .header-actions {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .zoom-controls {
    display: flex;
    align-items: center;
    background: var(--panel-sub);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    overflow: hidden;
  }
  .btn-zoom {
    height: 32px;
    padding: 0 10px;
    border: none;
    background: transparent;
    color: var(--ink);
    font-size: 13px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  .btn-zoom:hover { background: #e8e6dc; }
  .zoom-level {
    font-size: 12px;
    padding: 0 8px;
    color: var(--muted);
    min-width: 48px;
    text-align: center;
    user-select: none;
  }
  .menu-toggle {
    display: none;
    font-size: 20px;
    border: none;
    background: transparent;
    cursor: pointer;
    padding: 6px;
    color: var(--ink);
  }

  /* 主版面佈局 */
  .wrap {
    display: flex;
    height: calc(100vh - 60px);
    position: relative;
  }

  /* 側邊欄 Sidebar */
  nav {
    width: 320px;
    flex-shrink: 0;
    overflow-y: auto;
    border-right: 1px solid var(--line);
    background: var(--panel);
    padding: 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .filter-tags {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 6px;
    scrollbar-width: thin;
  }
  .filter-pill {
    padding: 4px 10px;
    font-size: 12px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 14px;
    color: var(--ink-light);
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
  }
  .filter-pill.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  /* 會議目錄分組 */
  .nav-group { margin-bottom: 8px; }
  .group-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 10px;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
    border-radius: var(--radius-sm);
  }
  .group-header:hover { background: var(--bg); }
  .group-header .chevron { transition: transform 0.2s; font-size: 11px; }
  .nav-group.collapsed .group-header .chevron { transform: rotate(-90deg); }
  .nav-group.collapsed .group-list { display: none; }
  .group-count {
    font-size: 11px;
    background: var(--line-light);
    color: var(--ink-light);
    padding: 1px 7px;
    border-radius: 10px;
  }

  /* 會議清單條目 */
  .group-list { display: flex; flex-direction: column; gap: 4px; }
  .nav-item {
    display: block;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    color: var(--ink);
    text-decoration: none;
    cursor: pointer;
    transition: all 0.15s;
    border-left: 3px solid transparent;
  }
  .nav-item:hover { background: var(--panel-sub); }
  .nav-item.on {
    background: var(--accent-light);
    border-left-color: var(--accent);
    color: var(--accent-dark);
  }
  .nav-item-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 2px;
  }
  .nav-item-title {
    font-size: 14px;
    font-weight: 600;
  }
  .nav-item-week {
    font-size: 11px;
    background: rgba(0,0,0,0.05);
    padding: 1px 5px;
    border-radius: 4px;
    white-space: nowrap;
    color: var(--ink-light);
  }
  .nav-item-date {
    font-size: 12px;
    color: var(--muted);
    display: block;
  }
  .nav-item-badges {
    display: flex;
    gap: 4px;
    margin-top: 5px;
  }
  .dept-badge {
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 4px;
    background: #f0ece3;
    color: #635b4f;
  }
  .dept-badge.教 { background: #e3edf7; color: #1e4976; }
  .dept-badge.學 { background: #e4f4ea; color: #1c6637; }
  .dept-badge.總 { background: #fbf0dc; color: #855314; }
  .dept-badge.輔 { background: #f6e8f4; color: #7d2974; }

  /* 主內容區 Main Area */
  main {
    flex: 1;
    overflow-y: auto;
    padding: 24px 32px 60px;
    scroll-behavior: smooth;
  }

  .doc {
    background: var(--panel);
    padding: 32px 38px;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    max-width: 960px;
    margin: 0 auto;
    border: 1px solid var(--line);
    transition: max-width 0.2s ease;
  }

  /* 文章標題與控制工具列 */
  .doc-header {
    border-bottom: 1px solid var(--line-light);
    padding-bottom: 18px;
    margin-bottom: 20px;
  }
  .doc-title-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 12px;
  }
  .doc h2 {
    margin: 0;
    font-size: 24px;
    color: var(--ink);
    font-weight: 700;
  }
  .doc-meta {
    display: flex;
    align-items: center;
    gap: 14px;
    color: var(--muted);
    font-size: 14px;
    flex-wrap: wrap;
    margin-top: 6px;
  }
  .meta-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  /* 操作工具列 */
  .toolbar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 14px;
  }
  .tool-btn {
    padding: 6px 12px;
    font-size: 12.5px;
    border: 1px solid var(--line);
    background: var(--panel-sub);
    color: var(--ink-light);
    border-radius: var(--radius-sm);
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: all 0.15s;
  }
  .tool-btn:hover {
    background: #fff;
    color: var(--accent);
    border-color: var(--accent);
  }

  /* 本次會議重點速覽卡片 (TL;DR) */
  .summary-card {
    background: var(--warm-bg);
    border: 1px solid #f2dfc5;
    border-radius: var(--radius-md);
    padding: 16px 20px;
    margin-bottom: 20px;
  }
  .summary-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    user-select: none;
  }
  .summary-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--warm);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .summary-toggle {
    font-size: 12px;
    color: var(--warm);
    opacity: 0.8;
  }
  .summary-list {
    margin: 12px 0 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .summary-list.collapsed { display: none; }
  .summary-item {
    font-size: 13.5px;
    line-height: 1.5;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .summary-cat {
    font-weight: 700;
    font-size: 11px;
    background: #edd8bf;
    color: var(--warm);
    padding: 1px 6px;
    border-radius: 4px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* 處室段落導航條 */
  .dept-jump-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 20px;
    padding: 10px 14px;
    background: var(--panel-sub);
    border-radius: var(--radius-sm);
    border: 1px solid var(--line-light);
    font-size: 13px;
  }
  .dept-jump-bar span { color: var(--muted); font-size: 12px; }
  .dept-jump-pill {
    padding: 3px 10px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--accent);
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    transition: all 0.15s;
  }
  .dept-jump-pill:hover {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  /* 原始 PDF 模式 (PDF Mode) */
  #pages {
    width: 100%;
    display: block;
    margin-top: 10px;
  }
  .page {
    position: relative;
    margin: 0 auto 20px;
    box-shadow: var(--shadow-md);
    background: #fff;
    border-radius: 4px;
    overflow: hidden;
    transition: box-shadow 0.3s ease;
  }
  .page canvas { display: block; }
  .textLayer {
    position: absolute;
    left: 0;
    top: 0;
    right: 0;
    bottom: 0;
    overflow: hidden;
    opacity: 0.2;
    line-height: 1.0;
  }
  .textLayer ::selection {
    background: #2e5c8a;
    color: #fff;
  }
  .textLayer .kw {
    background: rgba(255, 213, 0, 0.65) !important;
    border-radius: 2px;
  }
  .loading-msg {
    padding: 40px;
    text-align: center;
    color: var(--muted);
    font-size: 15px;
  }

  /* 搜尋結果樣式 */
  .search-results-header {
    margin-bottom: 16px;
    font-size: 15px;
    color: var(--ink-light);
  }
  .hit {
    background: var(--panel);
    padding: 16px 20px;
    border-radius: var(--radius-md);
    margin-bottom: 12px;
    cursor: pointer;
    border: 1px solid var(--line);
    transition: all 0.15s;
    max-width: 960px;
    margin: 0 auto 12px;
  }
  .hit:hover {
    border-color: var(--accent);
    box-shadow: var(--shadow-sm);
  }
  .hit-title-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .hit-title { font-weight: 700; color: var(--accent); font-size: 16px; }
  .hit p {
    margin: 6px 0 0;
    color: var(--ink-light);
    font-size: 14px;
    line-height: 1.6;
    background: var(--panel-sub);
    padding: 8px 12px;
    border-radius: var(--radius-sm);
  }
  mark { background: #ffe685; padding: 0 2px; border-radius: 2px; }

  /* 輕量 Toast 提示 */
  #toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: rgba(32, 36, 40, 0.9);
    color: #fff;
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 13.5px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    z-index: 1000;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.25s ease;
    pointer-events: none;
  }
  #toast.show {
    opacity: 1;
    transform: translateY(0);
  }

  /* 列印最佳化 */
  @media print {
    header, nav, .toolbar, .filter-tags, .dept-jump-bar, .summary-card { display: none !important; }
    body { background: #fff; color: #000; }
    .wrap { display: block; height: auto; }
    main { padding: 0; }
    .doc { border: none; box-shadow: none; padding: 0; max-width: 100%; }
  }

  /* 手機與平板響應式設計 */
  @media (max-width: 820px) {
    header { padding: 0 14px; gap: 10px; }
    .menu-toggle { display: block; }
    .brand small { display: none; }
    .wrap { position: relative; }
    nav {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 280px;
      z-index: 90;
      box-shadow: 2px 0 12px rgba(0,0,0,0.15);
      transform: translateX(-100%);
      transition: transform 0.25s ease;
    }
    nav.open { transform: translateX(0); }
    .nav-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.3);
      z-index: 80;
      display: none;
    }
    .nav-backdrop.open { display: block; }
    main { padding: 16px 14px; }
    .doc { padding: 18px 14px; }
    .doc h2 { font-size: 20px; }
    .doc-title-row { flex-direction: column; }
    .zoom-controls { display: none; }
  }
</style>
</head>
<body>

<header>
  <button class="menu-toggle" id="menuToggle" aria-label="切換選單">☰</button>
  <a class="brand" href="#">
    <div class="brand-icon">📚</div>
    <div>
      <h1>會議資料庫</h1>
      <small>教師午會資料圖書館</small>
    </div>
  </a>

  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input id="q" placeholder="全文檢索所有會議紀錄… (Ctrl+F 或 ⌘K)" autocomplete="off">
    <button class="search-clear" id="searchClear" aria-label="清除搜尋">✕</button>
  </div>

  <div class="header-actions">
    <div class="zoom-controls">
      <button class="btn-zoom" id="zoomOut" title="縮小 (Zoom Out)">🔍−</button>
      <span class="zoom-level" id="zoomLabel">100%</span>
      <button class="btn-zoom" id="zoomIn" title="放大 (Zoom In)">🔍+</button>
      <button class="btn-zoom" id="zoomReset" title="重設縮放">適應</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="nav-backdrop" id="navBackdrop"></div>
  <nav id="nav">
    <div class="filter-tags" id="filterTags">
      <div class="filter-pill active" data-dept="">全部</div>
      <div class="filter-pill" data-dept="教務處">教務處</div>
      <div class="filter-pill" data-dept="學務處">學務處</div>
      <div class="filter-pill" data-dept="總務處">總務處</div>
      <div class="filter-pill" data-dept="輔導處">輔導處</div>
    </div>
    <div id="navList">載入中…</div>
  </nav>

  <main id="main">
    <div class="loading-msg">正在載入圖書館資料…</div>
  </main>
</div>

<div id="toast"></div>

<script>
// ===== 後端 Apps Script API（備援用）=====
const API_URL = 'https://script.google.com/macros/s/AKfycbxKcTnI295GXzyUzAkfN0RoWRFot20CI2C70Ok8Vc14AiNsZrkvcEsKnzC4uz1nPXr9/exec';
// ===========================================

let data = [];
let cur = null;
let currentDeptFilter = '';
let currentZoom = parseFloat(localStorage.getItem('pdfZoom') || '1.0');

const $ = id => document.getElementById(id);
const esc = s => (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const reEsc = s => (s || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

// Toast 提示訊息
function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// 縮放控制
function setZoom(scale, reRender = true) {
  currentZoom = Math.max(0.7, Math.min(1.8, Math.round(scale * 10) / 10));
  localStorage.setItem('pdfZoom', currentZoom);
  $('zoomLabel').textContent = Math.round(currentZoom * 100) + '%';
  const docEl = document.querySelector('.doc');
  if (docEl) {
    const baseW = 960;
    docEl.style.maxWidth = Math.round(baseW * currentZoom) + 'px';
  }
  if (reRender && cur) {
    renderPdfMode(cur.id);
  }
}
$('zoomIn').onclick = () => { setZoom(currentZoom + 0.15); showToast(`文件縮放：${Math.round(currentZoom * 100)}%`); };
$('zoomOut').onclick = () => { setZoom(currentZoom - 0.15); showToast(`文件縮放：${Math.round(currentZoom * 100)}%`); };
$('zoomReset').onclick = () => { setZoom(1.0); showToast('已重設為標準寬度'); };

// 手機選單抽屜
const nav = $('nav');
const backdrop = $('navBackdrop');
function toggleMenu(open) {
  nav.classList.toggle('open', open);
  backdrop.classList.toggle('open', open);
}
$('menuToggle').onclick = () => toggleMenu(!nav.classList.contains('open'));
backdrop.onclick = () => toggleMenu(false);

// 初始化載入
load();
async function load() {
  try {
    let r = await fetch('data/index.json', { cache: 'no-cache' }).catch(() => null);
    if (!r || !r.ok) r = await fetch(API_URL);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    data = await r.json();
  } catch (e) {
    $('navList').textContent = '載入失敗：' + e.message;
    return;
  }
  if (!data.length) { $('navList').textContent = '尚無會議資料'; return; }

  renderNav();

  // 檢查 URL Hash（專屬分享連結）
  const hash = decodeURIComponent(location.hash.replace(/^#/, ''));
  let target = data.find(m => m.date === hash || m.id === hash);
  if (!target) {
    // 預設開啟離今天最近的會議
    const now = Date.now();
    target = data.reduce((a, b) =>
      Math.abs(new Date(b.date) - now) < Math.abs(new Date(a.date) - now) ? b : a);
  }
  show(target.id);
}

// 監聽網址 Hash 變動（歷史紀錄上一頁/下一頁）
window.onhashchange = () => {
  const hash = decodeURIComponent(location.hash.replace(/^#/, ''));
  if (hash && cur && cur.date !== hash && cur.id !== hash) {
    const target = data.find(m => m.date === hash || m.id === hash);
    if (target) show(target.id, null, false);
  }
};

// 處室標籤快篩
document.querySelectorAll('.filter-pill').forEach(pill => {
  pill.onclick = () => {
    document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    currentDeptFilter = pill.dataset.dept || '';
    renderNav();
  };
});

// 渲染左側目錄（依學年度/月份折疊分組）
function renderNav() {
  const listEl = $('navList');
  let filtered = data;
  if (currentDeptFilter) {
    const core = currentDeptFilter.replace(/(處|室)$/, '');
    // 嚴格依據處室標籤 (tags) 快篩，只有該處室真正有報告的會議才會顯示
    filtered = data.filter(m => m.tags && m.tags.some(t => t.includes(core)));
  }

  if (!filtered.length) {
    listEl.innerHTML = '<div style="color:var(--muted);padding:10px;font-size:13px;">無相符會議</div>';
    return;
  }

  // 依照學年度分組，若無則依年月
  const groups = {};
  filtered.forEach(m => {
    const key = m.academic_year || (m.date.slice(0, 4) + ' 年 ' + +m.date.slice(5, 7) + ' 月');
    if (!groups[key]) groups[key] = [];
    groups[key].push(m);
  });

  let html = '';
  let groupIndex = 0;
  for (const [groupName, items] of Object.entries(groups)) {
    const isFirst = groupIndex === 0;
    html += `
      <div class="nav-group ${isFirst ? '' : ''}" data-group="${esc(groupName)}">
        <div class="group-header" onclick="toggleNavGroup(this)">
          <span>📁 ${esc(groupName)}</span>
          <div style="display:flex;align-items:center;gap:6px">
            <span class="group-count">${items.length} 份</span>
            <span class="chevron">▼</span>
          </div>
        </div>
        <div class="group-list">
          ${items.map(m => `
            <a class="nav-item ${cur && cur.id === m.id ? 'on' : ''}" data-id="${m.id}" onclick="show('${m.id}')">
              <div class="nav-item-top">
                <span class="nav-item-title">${esc(m.title)}</span>
                ${m.week ? `<span class="nav-item-week">${esc(m.week)}</span>` : ''}
              </div>
              <span class="nav-item-date">📅 ${m.date}</span>
              ${m.tags && m.tags.length ? `
                <div class="nav-item-badges">
                  ${m.tags.slice(0, 4).map(t => `<span class="dept-badge ${t[0]}">${t.slice(0, 2)}</span>`).join('')}
                </div>
              ` : ''}
            </a>
          `).join('')}
        </div>
      </div>
    `;
    groupIndex++;
  }
  listEl.innerHTML = html;
}

function toggleNavGroup(headerEl) {
  const group = headerEl.closest('.nav-group');
  group.classList.toggle('collapsed');
}

// PDF.js 核心
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js';
const pdfCache = {};
let renderToken = 0;
const PDF_OPTS = {
  cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/',
  cMapPacked: true,
  standardFontDataUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/standard_fonts/'
};

function getPdf(id) {
  if (!pdfCache[id]) {
    pdfCache[id] = pdfjsLib.getDocument({ url: 'data/pdf/' + id + '.pdf', ...PDF_OPTS }).promise
      .catch(() => fetch(API_URL + '?pdf=' + id)
        .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
        .then(b64 => {
          if (b64.startsWith('ERR')) throw new Error(b64);
          const bin = atob(b64), bytes = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          return pdfjsLib.getDocument({ data: bytes, ...PDF_OPTS }).promise;
        }))
      .catch(e => { delete pdfCache[id]; throw e; });
  }
  return pdfCache[id];
}

// 開啟與呈現會議 (100% 完整原貌版，含所有照片、完整表格與簽核)
async function show(id, kw = null, updateHash = true) {
  cur = data.find(m => m.id === id);
  if (!cur) return;

  if (updateHash) {
    location.hash = '#' + cur.date;
  }

  // 關閉手機抽屜
  toggleMenu(false);

  // 選單標籤高亮
  document.querySelectorAll('.nav-item').forEach(a => a.classList.toggle('on', a.dataset.id === id));

  // 組合處室跳轉標籤
  const deptTagsHtml = (cur.tags && cur.tags.length) ? `
    <div class="dept-jump-bar">
      <span>📍 處室快速跳轉：</span>
      ${cur.tags.map(t => `<div class="dept-jump-pill" onclick="jumpToDept('${t}')">${t}</div>`).join('')}
    </div>
  ` : '';

  // 組合重點摘要卡片 (TL;DR)
  let summaryHtml = '';
  if (cur.summary && cur.summary.length) {
    summaryHtml = `
      <div class="summary-card">
        <div class="summary-header" onclick="this.nextElementSibling.classList.toggle('collapsed')">
          <span class="summary-title">💡 本次會議重點速覽</span>
          <span class="summary-toggle">收合 / 展開</span>
        </div>
        <ul class="summary-list">
          ${cur.summary.map(s => `
            <li class="summary-item">
              <span class="summary-cat">${esc(s.category)}</span>
              <span>${esc(s.text)}</span>
            </li>
          `).join('')}
        </ul>
      </div>
    `;
  }

  // 建立主卡片
  $('main').innerHTML = `
    <div class="doc" style="max-width:${Math.round(960 * currentZoom)}px">
      <div class="doc-header">
        <div class="doc-title-row">
          <div>
            <h2>${esc(cur.title)}</h2>
            <div class="doc-meta">
              <span class="meta-tag">📅 ${cur.date}</span>
              ${cur.academic_year ? `<span class="meta-tag">🎓 ${esc(cur.academic_year)}</span>` : ''}
              ${cur.week ? `<span class="meta-tag">📌 ${esc(cur.week)}</span>` : ''}
            </div>
          </div>
        </div>

        <!-- 動作工具列 -->
        <div class="toolbar">
          <button class="tool-btn" onclick="copyShareLink()">🔗 複製分享連結</button>
          <a class="tool-btn" href="data/pdf/${cur.id}.pdf" download="${cur.date}_${cur.title}.pdf">📥 下載 PDF</a>
          <button class="tool-btn" onclick="window.print()">🖨️ 列印本篇</button>
          <a class="tool-btn" href="${cur.url}" target="_blank" rel="noopener">☁️ 在 Google 雲端開啟 ↗</a>
        </div>
      </div>

      ${summaryHtml}
      ${deptTagsHtml}

      <!-- 原始原貌 PDF 檢視區 -->
      <div id="pages">
        <p class="loading-msg">📄 正在載入原始文件…</p>
      </div>
    </div>
  `;

  $('main').scrollTop = 0;
  renderPdfMode(id, kw);
}

// 跳轉到特定處室（直接在原版 PDF 頁面中尋找該處室並精準平滑滾動）
async function jumpToDept(deptName) {
  // 標準化處室名稱（校方編制為輔導處）
  const deptNorm = deptName.replace(/室$/, '處');
  const coreName = deptName.replace(/(處|室)$/, '');

  showToast(`正在定位 ${deptNorm}…`);
  try {
    // 若頁面尚未初始化完成，非同步等待最多 3 秒
    let waitTries = 0;
    while ((!window.currentPdf || !$('pages') || !$('pages').querySelector('.page')) && waitTries < 30) {
      await new Promise(r => setTimeout(r, 100));
      waitTries++;
    }

    const pdf = window.currentPdf || await getPdf(cur.id);
    const wraps = $('pages').querySelectorAll('.page');
    if (!wraps.length) {
      showToast(`文件仍在載入中，請稍候重試`);
      return;
    }

    let targetPage = -1;
    let fallbackPage = -1;

    for (let n = 1; n <= pdf.numPages; n++) {
      const page = await pdf.getPage(n);
      const textContent = await page.getTextContent();
      const fullText = textContent.items.map(it => it.str).join('').replace(/\s+/g, '');

      // 嚴格比對處室或其下轄組別之正式報告標題，避免隨意提及誤跳無關頁面
      let hasSectionHeader = fullText.includes('【' + deptNorm) ||
                             fullText.includes('【' + coreName + '處') ||
                             fullText.includes('【' + coreName + '室') ||
                             fullText.includes(deptNorm + '報告') ||
                             fullText.includes(coreName + '處報告') ||
                             fullText.includes(coreName + '室報告');

      if (!hasSectionHeader) {
        if (coreName === '總務') {
          hasSectionHeader = fullText.includes('【出納組') || fullText.includes('【事務組') || fullText.includes('【文書組');
        } else if (coreName === '教務') {
          hasSectionHeader = fullText.includes('【教學組') || fullText.includes('【註冊組') || fullText.includes('【課程組') || fullText.includes('【資訊組') || fullText.includes('【設備組');
        } else if (coreName === '學務') {
          hasSectionHeader = fullText.includes('【生教組') || fullText.includes('【訓育組') || fullText.includes('【體育組') || fullText.includes('【衛生組');
        } else if (coreName === '輔導') {
          hasSectionHeader = fullText.includes('【輔導組') || fullText.includes('【特教組') || fullText.includes('【資料組');
        }
      }

      if (hasSectionHeader) {
        targetPage = n;
        break;
      }
    }

    if (targetPage === -1) {
      showToast(`ℹ️ 本次會議中 ${deptNorm} 無獨立報告段落（僅於內文提及）`);
      return;
    }

    const finalPage = targetPage;

    const wrap = wraps[finalPage - 1];
    if (!wrap) return;

    // 確保該頁 Canvas 與 TextLayer 已完整繪製
    if (!wrap.dataset.done && window.pdfDrawPage) {
      await window.pdfDrawPage(finalPage, wrap);
    }

    // 計算在 main 容器內的絕對精確滾動高度，防止頂部被導航列或外框切掉
    const mainEl = $('main');
    const mainRect = mainEl.getBoundingClientRect();
    const wrapRect = wrap.getBoundingClientRect();
    const scrollTarget = mainEl.scrollTop + (wrapRect.top - mainRect.top) - 16;
    mainEl.scrollTo({ top: Math.max(0, scrollTarget), behavior: 'smooth' });

    // 視覺動畫回饋：醒目發光外框提示
    wrap.style.outline = '4px solid var(--accent)';
    wrap.style.boxShadow = '0 0 0 6px rgba(46,92,138,0.25), 0 8px 30px rgba(0,0,0,0.15)';
    wrap.style.transition = 'all 0.3s ease';
    setTimeout(() => {
      wrap.style.outline = 'none';
      wrap.style.boxShadow = '';
    }, 2800);

    // 高亮 textLayer 裡面的處室標題文字
    const tl = wrap.querySelector('.textLayer');
    if (tl) {
      const spans = tl.querySelectorAll('span');
      for (const sp of spans) {
        if (sp.textContent.includes(coreName)) {
          sp.classList.add('kw');
          break;
        }
      }
    }

    showToast(`✅ 已定位至第 ${finalPage} 頁（${deptNorm}）`);
  } catch (e) {
    showToast(`定位失敗：${e.message}`);
  }
}

// 複製分享連結
function copyShareLink() {
  const url = location.origin + location.pathname + '#' + cur.date;
  navigator.clipboard.writeText(url).then(() => {
    showToast('✅ 已複製本場會議分享連結！');
  }).catch(() => {
    showToast('複製失敗，連結：' + url);
  });
}

// 渲染 PDF 模式（Lazy loading + TextLayer 支援 Ctrl+F 與文字複製選取）
async function renderPdfMode(id, kw) {
  const token = ++renderToken;
  const box = $('pages');
  if (!box) return;
  box.innerHTML = '<p class="loading-msg">📄 正在載入原始文件…</p>';

  try {
    const pdf = await getPdf(id);
    if (token !== renderToken) return;
    window.currentPdf = pdf;
    box.innerHTML = '';

    const draw = async (n, wrap) => {
      if (wrap.dataset.done) return;
      wrap.dataset.done = '1';
      const page = await pdf.getPage(n);
      const vp = page.getViewport({ scale: box.clientWidth / page.getViewport({ scale: 1 }).width });
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      wrap.style.setProperty('--scale-factor', vp.scale);
      const canvas = document.createElement('canvas');
      canvas.width = vp.width * dpr;
      canvas.height = vp.height * dpr;
      canvas.style.width = vp.width + 'px';
      canvas.style.height = vp.height + 'px';
      const tl = document.createElement('div');
      tl.className = 'textLayer';
      wrap.append(canvas, tl);
      await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp, transform: [dpr, 0, 0, dpr, 0, 0] }).promise;
      await pdfjsLib.renderTextLayer({ textContentSource: await page.getTextContent(), container: tl, viewport: vp }).promise;
      return tl;
    };
    window.pdfDrawPage = draw;

    const first = await pdf.getPage(1);
    if (token !== renderToken) return;
    const v1 = first.getViewport({ scale: 1 });
    const h = box.clientWidth / v1.width * v1.height;
    const wraps = [];
    for (let n = 1; n <= pdf.numPages; n++) {
      const w = document.createElement('div');
      w.className = 'page';
      w.style.width = box.clientWidth + 'px';
      w.style.minHeight = h + 'px';
      box.append(w);
      wraps.push(w);
    }

    const io = new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting) {
        io.unobserve(e.target);
        draw(wraps.indexOf(e.target) + 1, e.target);
      }
    }), { root: $('main'), rootMargin: '1200px 0px' });

    if (kw) {
      for (let n = 1; n <= pdf.numPages && token === renderToken; n++) {
        const tl = await draw(n, wraps[n - 1]);
        const sp = tl && [...tl.querySelectorAll('span')].find(x => x.textContent.toLowerCase().includes(kw.toLowerCase()));
        if (sp) {
          tl.querySelectorAll('span').forEach(x => x.textContent.toLowerCase().includes(kw.toLowerCase()) && x.classList.add('kw'));
          sp.scrollIntoView({ block: 'center' });
          break;
        }
      }
    }
    wraps.forEach(w => io.observe(w));
  } catch (e) {
    if (token !== renderToken) return;
    box.innerHTML = `<p class="loading-msg">⚠️ 原始文件載入失敗（${esc(e.message)}）。<br><a href="data/pdf/${id}.pdf" target="_blank" style="color:var(--accent);text-decoration:underline;">點此直接開啟 PDF</a></p>`;
  }
}

// 搜尋功能（頂部跨會議即時全文搜尋）
const searchInput = $('q');
const searchClear = $('searchClear');

searchClear.onclick = () => {
  searchInput.value = '';
  searchClear.classList.remove('show');
  if (cur) show(cur.id);
};

searchInput.addEventListener('input', e => {
  const kw = e.target.value.trim();
  searchClear.classList.toggle('show', !!kw);

  if (!kw) {
    if (cur) show(cur.id);
    return;
  }

  const re = new RegExp(reEsc(kw), 'gi');
  const hits = data.map(m => {
    const full = (m.title + '\n' + (m.academic_year || '') + '\n' + (m.text || ''));
    const matches = full.match(re);
    if (!matches) return null;

    // 找出多個上下文片段
    const snippets = [];
    let pos = 0;
    while (snippets.length < 2 && pos < m.text.length) {
      const idx = m.text.slice(pos).search(re);
      if (idx === -1) break;
      const actualIdx = pos + idx;
      const start = Math.max(0, actualIdx - 35);
      const end = Math.min(m.text.length, actualIdx + 55);
      snippets.push(m.text.slice(start, end).replace(/\s+/g, ' '));
      pos = actualIdx + kw.length + 30;
    }
    return { m, count: matches.length, snippets };
  }).filter(Boolean);

  const hl = s => esc(s).replace(new RegExp(reEsc(esc(kw)), 'gi'), '<mark>$&</mark>');

  $('main').innerHTML = `
    <div style="max-width:960px;margin:0 auto">
      <div class="search-results-header">
        🔍 搜尋「<strong>${esc(kw)}</strong>」共找到 <strong>${hits.length}</strong> 份會議紀錄
      </div>
      ${hits.length ? hits.map(h => `
        <div class="hit" onclick="show('${h.m.id}', ${esc(JSON.stringify(kw))})">
          <div class="hit-title-row">
            <span class="hit-title">${hl(h.m.title)}</span>
            <span class="tag">📅 ${h.m.date} · ${h.count} 處符合</span>
          </div>
          ${h.snippets.map(snip => `<p>…${hl(snip)}…</p>`).join('')}
        </div>
      `).join('') : '<div class="hit"><p>沒有找到符合的會議內容，請嘗試其他關鍵字。</p></div>'}
    </div>
  `;
  $('main').scrollTop = 0;
});

// 快捷鍵支援：⌘+K / Ctrl+K 聚焦搜尋
window.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    searchInput.focus();
    searchInput.select();
  }
});
